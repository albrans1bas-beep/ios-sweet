name: mgprobe

# The iOS root image has no shell, so the guest probe is a tiny standalone
# Mach-O. Build it on the macOS runner (the only place with an iphoneos SDK)
# and publish it next to the kernel; rootfs.yml installs it into the image.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build guest helper
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 \
            -O2 -Wall -o mgprobe tools/mgprobe.c
          # SWEET's AMFI patch marks signed rootfs binaries as platform
          # binaries; an unsigned exec panics with "non-platform binary".
          codesign --force --sign - --timestamp=none mgprobe
          codesign --verify --verbose=2 mgprobe
          codesign --display --verbose=2 mgprobe
          file mgprobe
          lipo -info mgprobe || true
          ls -la mgprobe

      - name: Publish helper to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view kernel-latest >/dev/null 2>&1 || \
            gh release create kernel-latest --prerelease --title kernel-latest \
              --notes "Rolling SWEET kernel build (xnu.yml); not a product release."
          gh release upload kernel-latest mgprobe --clobber
