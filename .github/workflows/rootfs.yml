name: rootfs

on:
  workflow_dispatch:
    inputs:
      keep_image:
        description: 'Upload the ~6 GB rootfs image artifact (storage quota!)'
        type: boolean
        default: false
      secs:
        description: 'QEMU run length in seconds'
        type: string
        default: '1800'
      snap_every:
        description: 'Framebuffer snapshot interval in seconds'
        type: string
        default: '120'

permissions:
  contents: read
  actions: read

concurrency:
  group: rootfs

# /home is a small volume on the hosted runners: the IPSW, the OS dmgs and
# the finished image all live on /mnt (the attached ephemeral data disk).
env:
  BIG: /mnt/heavy
  # iPhone X (iPhone10,3) iOS 16.7.2 (20H392), the bring-up userland of the
  # upstream notes; downloaded fresh from Apple, never committed.
  IPSW_DEVICE: iPhone10,3
  IPSW_BUILD: 20H392

jobs:
  rootfs:
    # mkiosroot.sh is a Linux flow (apfs-fuse + mkfs.hfsplus + loop mounts)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free root disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/go /opt/pipx
          sudo docker image prune -af 2>/dev/null || true
          df -h /
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            hfsprogs qemu-system-arm libfuse3-dev bzip2 libbz2-dev zlib1g-dev \
            libattr1-dev cmake ninja-build g++ rsync clang llvm
          # sgan81/apfs-fuse: Alpine pins 66b86bd (2023-03-12); use the same.
          git clone -q https://github.com/sgan81/apfs-fuse
          git -C apfs-fuse checkout -q 66b86bd525e8cb90f9012543be89b1f092b75cf3
          git -C apfs-fuse submodule update --init --recursive
          cmake -S apfs-fuse -B apfs-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build apfs-build -j"$(nproc)" --target apfs-fuse
          sudo cp apfs-build/apfs-fuse /usr/local/bin/
          rm -rf apfs-fuse apfs-build
          # mkiosroot loop-mounts HFS+; the runner kernel (azure) ships hfsplus
          # in the -modules-extra package, not enabled by default.
          K=$(uname -r)
          sudo modprobe hfsplus 2>/dev/null || {
            sudo apt-get install -y "linux-modules-extra-$K"
            sudo modprobe hfsplus
          }
          grep -q hfsplus /proc/filesystems && echo "hfsplus ready"
          apfs-fuse --help 2>&1 | head -2 || true

      - name: Choose the big volume
        run: |
          sudo mkdir -p /mnt/heavy && sudo chown -R runner /mnt/heavy 2>/dev/null || true
          # /mnt size varies across runner images: only trust it with room.
          A=$(df -BG /mnt 2>/dev/null | awk 'NR==2{print $4}' | tr -d G)
          if [ "${A:-0}" -ge 20 ]; then BIG=/mnt/heavy; else BIG=/home/runner/heavy; fi
          mkdir -p "$BIG"
          echo "BIG=$BIG" >> "$GITHUB_ENV"
          echo "using $BIG"
          df -h / /mnt

      - name: Download IPSW
        run: |
          cd "$BIG"
          gh release download -R blacktop/ipsw -p '*linux_x86_64.tar.gz'
          tar xf ipsw_*_linux_x86_64.tar.gz
          BIN=$(find . -type f -name ipsw -perm -u+x | head -1)
          mv "$BIN" ipswbin
          ./ipswbin download ipsw --device "$IPSW_DEVICE" --build "$IPSW_BUILD" \
            --confirm --output ipsw-dl
          mv ipsw-dl/*.ipsw ipsw.ipsw
          rm -rf ipsw-dl ipsw_*_linux_x86_64.tar.gz manpages LICENSE README.md
          df -h "$PWD"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract the three OS dmgs
        run: |
          cd "$BIG"
          python3 - <<'EOF'
          import os, plistlib, zipfile
          z = zipfile.ZipFile('ipsw.ipsw')
          bm = plistlib.loads(z.read('BuildManifest.plist'))
          m = bm['BuildIdentities'][0]['Manifest']
          dmg = {k: v['Info']['Path'] for k, v in m.items()
                 if v.get('Info', {}).get('Path', '').endswith('.dmg')}
          print('dmg keys:', {k: os.path.basename(v) for k, v in dmg.items()})
          want = {}
          for k, p in dmg.items():
              lk = k.lower()
              if lk == 'os' or 'operating' in lk:
                  want['OS'] = p
              elif 'system' in lk:
                  want['SystemOS'] = p
              elif 'app' in lk:
                  want['AppOS'] = p
          assert set(want) == {'OS', 'SystemOS', 'AppOS'}, want
          for k, path in want.items():
              z.extract(path, 'dmgs')
              print(k, '->', path)
              os.replace(os.path.join('dmgs', path), f'dmgs/{k}.dmg')
          EOF
          rm -f ipsw.ipsw
          ls -la dmgs

      - name: Build the HFS+ root
        run: |
          sudo ./tools/mkiosroot.sh "$BIG"/dmgs/OS.dmg "$BIG"/dmgs/SystemOS.dmg \
            "$BIG"/dmgs/AppOS.dmg "$BIG"/rootfs.img 15G

      - name: Apply SWEET root tweaks
        run: |
          sudo fsck.hfsplus -fy "$BIG"/rootfs.img || true
          sudo mkdir -p /mnt/iosroot
          sudo mount -t hfsplus -o loop,force "$BIG"/rootfs.img /mnt/iosroot
          sudo python3 tools/sweet-root-tweaks.py /mnt/iosroot
          sudo umount /mnt/iosroot
          rm -rf "$BIG"/dmgs
          df -h "$BIG"

      - name: Patch UIKitCore complex bounding path in DSC
        run: |
          sudo fsck.hfsplus -fy "$BIG"/rootfs.img || true
          sudo mkdir -p /mnt/iosroot
          sudo mount -t hfsplus -o loop,force "$BIG"/rootfs.img /mnt/iosroot
          trap 'sudo umount /mnt/iosroot' EXIT
          CDIR=/mnt/iosroot/System/Library/Caches/com.apple.dyld
          sudo ls -la "$CDIR"
          # NOTE: `ipsw dyld disass` OOMs on this runner (~21 GB VA reservation
          # for the ~2 GB DSC symbol map), so the gate is a raw byte check.
          # iOS 16 splits the cache: `dyld_shared_cache_arm64` is a 393 KB
          # stub (mapping 0x180000000+0x5c000 only); the real images live in
          # the subcaches (.01, .02, ...) hard-linked into the same directory
          # by mkiosroot.sh. Scan every file; the a2s-derived entry of
          # -[UIScreen _boundingPathUtilities] (0x18908963c minus its +40
          # offset) must start with a standard arm64 prologue before we
          # overwrite it with `mov w0,#0; ret`.
          sudo python3 -c "
          import glob, struct
          vaddr = 0x189089614
          patch = struct.pack('<II', 0x52800000, 0xd65f03c0)
          CDIR = '$CDIR'
          hit = None
          for path in sorted(glob.glob(CDIR + '/dyld_shared_cache_arm64*')):
              try:
                  f = open(path, 'r+b')
              except IsADirectoryError:
                  continue
              hdr = f.read(0x4000)
              if len(hdr) < 0x1a0 or hdr[:7] != b'dyld_v1':
                  print('skip', path, hdr[:16])
                  continue
              mappingOffset, mappingCount = struct.unpack_from('<II', hdr, 16)
              f.seek(0, 2)
              fsize = f.tell()
              print(path, 'size', fsize, 'mappingOffset', mappingOffset, 'mappingCount', mappingCount)
              for i in range(mappingCount):
                  vm, sz = struct.unpack_from('<QQ', hdr, mappingOffset + i*32)
                  fo = struct.unpack_from('<I', hdr, mappingOffset + i*32 + 16)[0]
                  ok = sz > 0 and fo + sz <= fsize
                  print('  mapping', i, hex(vm), hex(sz), hex(fo), '' if ok else 'INVALID')
                  if ok and vm <= vaddr < vm + sz and hit is None:
                      hit = (path, f, fsize, fo + (vaddr - vm))
              if hit is None or hit[0] != path:
                  f.close()
          assert hit is not None, 'no cache mapping covers the vaddr'
          path, f, fsize, foff = hit
          print('patching', path, 'at', hex(foff))
          assert foff + 8 <= fsize, 'patch outside cache file'
          f.seek(foff)
          old = f.read(8)
          print('old bytes:', old.hex())
          w = struct.unpack('<I', old[:4])[0]
          if w in (0x52800000, 0xd65f03c0):
              print('already patched')
          elif (w & 0xffc00000) == 0xa9800000 or w == 0xd503237f:
              f.seek(foff)
              f.write(patch)
              f.seek(foff)
              nb = f.read(8)
              print('new bytes:', nb.hex())
              assert nb == patch
              print('PATCHED UIScreen _boundingPathUtilities -> mov w0,#0; ret in', path)
          else:
              print('first word', hex(w), 'is not a known prologue; refusing')
              raise SystemExit(1)
          f.close()
          "

      - name: Fetch the latest kernel from the rolling release
        run: |
          mkdir -p kernel
          gh release download kernel-latest -D kernel --pattern 'kernel.development.sweet' --clobber
          ls -la kernel
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build the boot payload
        run: python3 tools/mkadt.py "$BIG"/sweet-qemu.adt --qemu

      - name: QEMU smoke test
        run: |
          python3 tools/mkpayload.py kernel/kernel.development.sweet "$BIG"/sweet-qemu.adt \
            "$BIG"/payload.bin --cmdline "rd=vroot0 debug=0xc serial=3 cpus=1 keepsyms=1 unentitled_ios_sim_launch ignition_level=1 launchd_unsecure_cache=1 launchd_ios_sessions=1 sweetvio_test=1 sweetfb_noconsole=1 sweetproc_dump=600 sweet_exit_trace=1 sweet_sample=450 sweet_sample_names=SpringBoard,MobileGestaltHel,lsd,cfprefsd,containermanager,launchd,backboardd sweet_nosync=1 -enable_kprintf_spam -noprogress wdt=-1"
          sudo env PATH="$PATH" python3 tools/qemu-sweet.py "$BIG"/payload.bin qemu-out \
            --secs "${{ inputs.secs }}" --snap-every "${{ inputs.snap_every }}" --kernel kernel/kernel.development.sweet --disk "$BIG"/rootfs.img \
            --dump-symbol sweet_log_ring:0x400000 --dump-symbol sweet_log_total:8 \
            --fail-on-panic
          sha256sum qemu-out/fb-*.png | awk '{print substr($1,1,12), $2}' || true
          grep -E 'exec launchd|exec xpcproxy|panic' qemu-out/fb.txt || true
          if grep -q '"status": "panic"' qemu-out/result.json; then
            echo "panic observed"; exit 1
          fi
          python3 tools/sweetlog-extract.py qemu-out/sweet_log_ring.bin qemu-out/sweet_log_total.bin sweetlog.txt
          echo "--- sweetlog.txt.gz.b64 ---"
          gzip -9 -c sweetlog.txt | base64 -w0
          echo
          echo "--- fb.txt.b64 ---"
          gzip -9 -c qemu-out/fb.txt | base64 -w0 || true
          echo
          echo "--- fb.png.b64 ---"
          base64 -w0 qemu-out/fb.png || true
          echo
          grep -aE 'SWEET VIO TEST: level 1: [0-9]+ checks, 0 failures' sweetlog.txt
          grep -aq 'exec SpringBoard' sweetlog.txt
          grep -aE 'exec SpringBoard' sweetlog.txt
          echo "hfs corruption lines: $(grep -ac 'hfs_swap_BTNode\|BlockMarkFreeInternal' sweetlog.txt || true)"
          grep -aE 'hfs_swap_BTNode|BlockMarkFreeInternal|panic' sweetlog.txt | head -20 || true
          echo "--- last process dump ---"
          awk '/SWEET PROC DUMP/{if (blk != "") last = blk; blk = $0 "\n"; next} /SWEET PROC: ppid/{blk = blk $0 "\n"} END{if (blk != "") last = blk; printf "%s", last}' sweetlog.txt | grep -a 'SpringBoard\|backboardd' || true
          echo "--- SpringBoard thread samples ---"
          grep -aE 'SWEET SAMPLE:|SMP [A-Za-z]' sweetlog.txt | head -200 || true
          echo "--- SpringBoard-ish userland lines ---"
          grep -aiE 'springboard|backboardd|UIKit|FrontBoard|BKS|CoreAnimation|CAPortal' sweetlog.txt | grep -av 'SWEET AKS\|SWEET FB:\|SWEET SURF\|IOK \|exec ' | head -120 || true
          echo "--- last 40 console lines ---"
          tail -c 20000 sweetlog.txt | tr -d '\000' | tail -40
          echo "--- launchd lines (tail) ---"
          grep -a 'xpc.launchd' sweetlog.txt | tail -60 || true
          echo "--- crash/kill lines ---"
          grep -aE 'CRASH|SIGKILL|SIGABRT|SIGSEGV|exited|abnormal|Jetsam|jetsam' sweetlog.txt | tail -40 || true
          echo "--- process exits (tail) ---"
          grep -a 'SWEET EXIT:' sweetlog.txt | tail -80 || true
          echo "--- exits by process ---"
          grep -a 'SWEET EXIT:' sweetlog.txt | awk '{print $8}' | sort | uniq -c | sort -rn | head -20 || true
          echo "--- host priv trace ---"
          grep -a 'SWEET SECTOK:\|SWEET MULTIUSER:' sweetlog.txt | head -40 || true

      - name: Symbolicate SpringBoard samples
        if: always()
        run: |
          [ -f sweetlog.txt ] || exit 0
          python3 - <<'EOF' > sample-addrs.txt
          import re, sys
          procs, slide = {}, None
          for line in open('sweetlog.txt', encoding='utf-8', errors='replace'):
              m = re.search(r'SMP (\S+)\[\d+\] slide (0x[0-9a-f]+)', line)
              if m:
                  slide = int(m.group(2), 16)
                  procs.setdefault(m.group(1), [])
                  continue
              if slide is None:
                  continue
              m = re.match(r'SMP (\S+) t\d+ ', line)
              if not m:
                  continue
              lst = procs.setdefault(m.group(1), [])
              for tok in re.findall(r'(?:pc|lr) (0x[0-9a-f]+)', line):
                  lst.append(int(tok, 16) - slide)
              b = line.find(' bt ')
              if b >= 0:
                  for tok in re.findall(r'0x[0-9a-f]{6,}', line[b:]):
                      lst.append(int(tok, 16) - slide)
          out, seen = [], set()
          for name in ('SpringBoard', 'MobileGestaltHel', 'lsd', 'cfprefsd', 'containermanager', 'launchd'):
              for a in procs.get(name, []):
                  if 0x180000000 <= a < 0x280000000 and a not in seen:
                      seen.add(a)
                      out.append(a)
          for a in out[:220]:
              print(hex(a))
          print('per process:', {k: len(v) for k, v in procs.items()}, 'unique:', len(out), file=sys.stderr)
          EOF
          if [ ! -s sample-addrs.txt ]; then echo "no sample addresses"; exit 0; fi
          sudo mkdir -p /mnt/dsc
          sudo fsck.hfsplus -fy "$BIG"/rootfs.img >/dev/null 2>&1 || true
          sudo mount -o loop,force "$BIG"/rootfs.img /mnt/dsc || exit 0
          trap 'sudo umount /mnt/dsc' EXIT
          CDIR=/mnt/dsc/System/Library/Caches/com.apple.dyld
          echo "--- cache dir ---"; sudo ls -la "$CDIR" | head -25 || true
          sudo ls -la "$CDIR" | grep -i symbols || echo "NO .symbols subcache"
          DSC="$CDIR/dyld_shared_cache_arm64"
          if [ ! -f "$DSC" ]; then
            DSC=$(sudo find /mnt/dsc -name 'dyld_shared_cache_arm64' -type f | head -1)
          fi
          if [ -z "$DSC" ] || [ ! -f "$DSC" ]; then echo "no dyld cache"; exit 0; fi
          echo "using $DSC"
          echo "--- symbolicated SpringBoard sample frames ---"
          first=$(head -1 sample-addrs.txt)
          echo "== $first (verbose)"
          set +e
          "$BIG"/ipswbin dyld a2s "$DSC" "$first" -d
          echo "exit $?"
          set -e
          tail -n +2 sample-addrs.txt | while read -r u; do
            echo "== $u"
            timeout 90 "$BIG"/ipswbin dyld a2s "$DSC" "$u" -d 2>&1 | head -2 || true
          done
          echo "--- symbolicated SpringBoard crash stack ---"
          grep -a -A6 'First throw call stack' sweetlog.txt | head -10 || true
          CRASHLINE=$(grep -a -A6 'First throw call stack' sweetlog.txt | grep -oE '0x1[0-9a-f]{8}' | head -32)
          SLIDE=$(grep -aoE 'SMP [A-Za-z]+\[[0-9]+\] slide 0x[0-9a-f]+' sweetlog.txt | head -1 | grep -oE '0x[0-9a-f]+' || true)
          SLIDE=${SLIDE:-0x0}
          echo "slide=$SLIDE"
          for u in $CRASHLINE; do
            u2=$(python3 -c "print(hex(int('$u',16)-int('$SLIDE',16)))")
            echo "== $u (unslid $u2)"
            timeout 90 "$BIG"/ipswbin dyld a2s "$DSC" "$u2" -d 2>&1 | head -3 || true
          done

      - name: Symbolicate known SpringBoard crash stack
        if: always()
        run: |
          sudo mkdir -p /mnt/crash
          sudo fsck.hfsplus -fy "$BIG"/rootfs.img >/dev/null 2>&1 || true
          sudo mount -o loop,force "$BIG"/rootfs.img /mnt/crash || exit 0
          trap 'sudo umount /mnt/crash' EXIT
          DSC=/mnt/crash/System/Library/Caches/com.apple.dyld/dyld_shared_cache_arm64
          [ -f "$DSC" ] || DSC=$(sudo find /mnt/crash -name 'dyld_shared_cache_arm64' -type f | head -1)
          [ -f "$DSC" ] || exit 0
          SLIDE=$(grep -aoE 'SMP [A-Za-z]+\[[0-9]+\] slide 0x[0-9a-f]+' sweetlog.txt 2>/dev/null | head -1 | grep -oE '0x[0-9a-f]+' || true)
          SLIDE=${SLIDE:-0x1dbec000}
          echo "slide=$SLIDE"
          # SpringBoard's "First throw call stack" for the nil-URL exception
          # (2026-11-23 QEMU run, slide 0x4da54000) plus that run's CRASH bt.
          python3 -c "
          slide = int('$SLIDE', 16)
          throw = '''
          0x1d484540c 0x1cdb21c28 0x1cebeef10 0x1cebeeca0 0x1db800e8c
          0x1fe798410 0x1fe79831c 0x1fe7ab3d4 0x1fe7ab1a8 0x1fe784878
          0x1fe7986f8 0x2135576c4 0x213558210 0x21355743c 0x1db5ec780
          0x1db5bcddc 0x213237ae0 0x21358d2c0 0x1db5ec780 0x1db5bcddc
          0x21322fc48 0x2132fc39c 0x1db7aa4bc 0x1db7a35e8 0x2132fc110
          0x2132f77ec 0x2132d5ad4 0x2133fb59c 0x2133fa8ec 0x213783378
          0x1d693acdc 0x1d69c7fb8 0x1d69c7ac0 0x1f00e9010 0x1e936aefc
          '''.split()
          bt = '''
          0x1db6b04b8 0x21f532f54 0x21f523a4c 0x1cdb26afc 0x21f532424
          0x21f5323d4 0x1db5ec794 0x1db5bcddc 0x213237ae0 0x21358d2c0
          '''.split()
          # dyld backtraces out of the cache are usually already unslid; try
          # both and let the resolver pick whichever lands in a mapping.
          for a in throw + bt:
              print(hex(int(a, 16) - slide))
          print('#raw')
          for a in throw + bt:
              print(a)
          " > /tmp/unslid.txt
          sed -n '/#raw/q;p' /tmp/unslid.txt > /tmp/try.txt
          cat /tmp/try.txt
          while read -r u; do
            echo "== $u"
            timeout 90 "$BIG"/ipswbin dyld a2s "$DSC" "$u" -d 2>&1 | head -3 || true
          done < /tmp/try.txt
          echo "=== retry as already-unslid addresses ==="
          sed -n '/#raw/,$p' /tmp/unslid.txt | tail -n +2 > /tmp/try2.txt
          while read -r u; do
            out=$(timeout 90 "$BIG"/ipswbin dyld a2s "$DSC" "$u" -d 2>&1 | head -2)
            case "$out" in *'No mapping'*|*'not found'*|'') continue;; esac
            echo "== $u"; echo "$out"
          done < /tmp/try2.txt

      - name: fsck after boot
        if: always()
        run: |
          fsck.hfsplus -f -n "$BIG"/rootfs.img 2>&1 | tail -30 | tee fsck-after.txt || true
          echo "--- fsck-after ---"; tail -12 fsck-after.txt || true

      - name: Collect crash reports from the image
        if: always()
        run: |
          sudo mkdir -p /mnt/post
          sudo mount -o ro,loop "$BIG"/rootfs.img /mnt/post || exit 0
          echo "--- LaunchServices state in the image ---"
          for d in /mnt/post/private/var/db/lsd \
                   /mnt/post/private/var/mobile/Library/Preferences/com.apple.MobileCoreServices; do
            echo "## $d"; sudo ls -la "$d" 2>&1 | head -20 || true
          done
          sudo find /mnt/post/private/var/db/lsd -maxdepth 2 -type f -printf '%s %p\n' 2>/dev/null | head -20 || true
          echo "--- launchd usersession strings ---"
          sudo strings -a /mnt/post/sbin/launchd 2>/dev/null | grep -iE 'usersession|user_session|libinfo|multiuser|foreground|vproc|trap|session' | head -80 || true
          echo "--- introspection tools ---"
          for f in /mnt/post/bin/sh /mnt/post/bin/launchctl /mnt/post/usr/bin/launchctl /mnt/post/usr/bin/sample /mnt/post/usr/bin/log; do printf '%s: ' $f; sudo test -x $f && echo yes || echo no; done
          echo "--- entitlements ---"
          for b in /mnt/post/sbin/launchd /mnt/post/usr/libexec/usermanagerd /mnt/post/usr/libexec/lsd; do
            echo "## $b"
            [ -f "$b" ] && timeout 120 "$BIG"/ipswbin macho info -e "$b" 2>&1 | head -120 || echo "missing"
          done
          echo "--- imported symbols of interest ---"
          for b in /mnt/post/usr/libexec/usermanagerd /mnt/post/sbin/launchd; do
            echo "## $b"
            [ -f "$b" ] && timeout 120 "$BIG"/ipswbin macho info -n "$b" 2>/dev/null | grep -iE 'host_set|multiuser|vproc|usersession|foreground|nextsession' | head -60 || echo "missing"
          done
          echo "--- usermanagerd strings ---"
          sudo strings -a /mnt/post/usr/libexec/usermanagerd 2>/dev/null | grep -iE 'foreground|usersession|multiuser|libinfo|launchd|nextsession|host_priv|commpage|persona' | head -100 || true
          echo "--- gestalt cache ---"
          sudo find /mnt/post/private/var/containers/Shared/SystemGroup/systemgroup.com.apple.mobilegestaltcache -maxdepth 5 -printf '%s %p\n' 2>/dev/null | head -30 || true
          sudo ls -la /mnt/post/private/var/containers/Shared/SystemGroup/systemgroup.com.apple.mobilegestaltcache/Library/Caches 2>/dev/null || true
          sudo strings -a /mnt/post/private/var/containers/Shared/SystemGroup/systemgroup.com.apple.mobilegestaltcache/Library/Caches/com.apple.MobileGestalt.plist 2>/dev/null | head -60 || true
          echo "--- launchd session config strings ---"
          sudo strings -a /mnt/post/sbin/launchd 2>/dev/null | grep -i -B4 -A4 'ios_sessions\|iOSSessions\|user_sessions' | head -80 || true
          echo "--- LaunchDaemons (gestalt/cfprefsd/user) ---"
          sudo ls /mnt/post/System/Library/LaunchDaemons 2>/dev/null | wc -l || true
          sudo ls /mnt/post/System/Library/LaunchDaemons 2>/dev/null | grep -iE 'gestalt|cfprefsd|user|login|window|SpringBoard' || true
          sudo grep -l -i 'gestalt' /mnt/post/System/Library/LaunchDaemons/*.plist 2>/dev/null | head || true
          echo "--- LaunchAgents ---"
          sudo ls /mnt/post/System/Library/LaunchAgents 2>/dev/null | head -60 || true
          sudo grep -l -i 'cfprefsd' /mnt/post/System/Library/LaunchAgents/*.plist 2>/dev/null | head || true
          echo "--- user database ---"
          for f in /mnt/post/private/etc/master.passwd /mnt/post/private/etc/passwd; do
            echo "## $f"
            sudo grep -E '^(root|mobile|_?loginwindow|_windowserver|daemon):' "$f" 2>/dev/null | head -20 || true
          done
          echo "--- keybags ---"
          sudo ls -la /mnt/post/private/var/keybags 2>/dev/null | head -10 || true
          echo "--- launchd jobs with user/session services ---"
          sudo python3 -c "
          import plistlib
          p = plistlib.load(open('/mnt/post/System/Library/xpc/launchd.plist', 'rb'))
          keys = ('user', 'session', 'libinfo', 'muser', 'cfprefsd', 'containermanager',
                  'usermanagerd', 'launchservices', 'lsd', 'gestalt')
          def walk(o):
              if isinstance(o, dict):
                  if 'Label' in o:
                      ms = o.get('MachServices') or {}
                      names = list(ms) if isinstance(ms, dict) else (ms if isinstance(ms, list) else [])
                      hits = [s for s in names if any(k in s.lower() for k in keys)]
                      label = str(o.get('Label', ''))
                      if hits or any(k in label.lower() for k in keys):
                          print(label, '=>', hits,
                                'sess=', o.get('LimitLoadToSessionType'),
                                'user=', o.get('UserName'),
                                'program=', o.get('Program') or o.get('ProgramArguments'))
                  for v in o.values():
                      walk(v)
              elif isinstance(o, list):
                  for v in o:
                      walk(v)
          walk(p)
          "
          echo "--- launchd global session keys ---"
          sudo python3 -c "
          import plistlib
          p = plistlib.load(open('/mnt/post/System/Library/xpc/launchd.plist', 'rb'))
          lines = []
          def walk(o, path=''):
              if isinstance(o, dict):
                  for k, v in o.items():
                      s = str(k).lower()
                      if ('session' in s or 'ios' in s) and not isinstance(v, (dict, list)):
                          lines.append(path + '/' + str(k) + ' = ' + repr(v))
                      walk(v, path + '/' + str(k))
              elif isinstance(o, list):
                  for i, v in enumerate(o):
                      walk(v, path + '[' + str(i) + ']')
          walk(p)
          for l in lines[:80]:
              print(l)
          "
          echo "--- usersession strings in dyld cache ---"
          sudo grep -aohE "com\.apple\.[A-Za-z0-9._-]*(user|User|session|Session)[A-Za-z0-9._-]*" \
            /mnt/post/System/Library/Caches/com.apple.dyld/dyld_shared_cache_arm64* 2>/dev/null \
            | sort -u | head -60 || true
          echo "--- libxpc usersession service strings ---"
          DSC2=/mnt/post/System/Library/Caches/com.apple.dyld/dyld_shared_cache_arm64
          if [ -f "$DSC2" ] && [ -x "$BIG/ipswbin" ]; then
            timeout 300 "$BIG"/ipswbin dyld str "$DSC2" "muser" "usersession" "user_sessions" 2>&1 | head -60 || true
            echo "--- xpc_user_sessions_info_routine (quiet) ---"
            timeout 300 "$BIG"/ipswbin dyld disass "$DSC2" --vaddr 0x1d1bf17d8 --count 120 --quiet 2>&1 | head -140 || true
            echo "--- libxpc user session bytes ---"
            timeout 300 "$BIG"/ipswbin dyld dump "$DSC2" 0x1d1bf17d8 --size 640 --bytes 2>&1 | head -50 || true
          else
            echo "no cache or ipswbin"
          fi
          echo "--- LaunchServices files ---"
          sudo find /mnt/post/private/var -iname '*launchservices*' -printf '%s %p\n' 2>/dev/null | head -40 || true
          echo "--- container counts ---"
          printf 'Applications: '; sudo ls /mnt/post/Applications 2>/dev/null | wc -l || true
          for d in /mnt/post/private/var/mobile/Containers/Data/Application \
                   /mnt/post/private/var/mobile/Containers/Data/PluginKitPlugin \
                   /mnt/post/private/var/mobile/Containers/Data/InternalDaemon \
                   /mnt/post/private/var/mobile/Containers/Shared/AppGroup; do
            printf '%s: ' "$d"; sudo ls "$d" 2>/dev/null | wc -l || true
          done
          sudo find /mnt/post/private/var/mobile/Containers -maxdepth 5 \
            -name '.com.apple.mobile_container_manager.metadata.plist' 2>/dev/null | wc -l || true
          echo "--- crash report dirs ---"
          for d in /mnt/post/private/var/mobile/Library/Logs/CrashReporter \
                   /mnt/post/private/var/log/CrashReporter \
                   /mnt/post/private/var/Logs/CrashReporter; do
            [ -d "$d" ] && sudo ls -lat "$d" | head -20 && echo "  ^ $d"
          done
          echo "--- ips files (newest first) ---"
          sudo find /mnt/post/private/var -name '*.ips' -o -name '*.panic' 2>/dev/null | head -30
          NEW=$(sudo find /mnt/post/private/var -name '*.ips' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -n "$NEW" ]; then
            echo "=== newest crash report: $NEW ==="
            sudo head -c 30000 "$NEW" || true
            sudo cp "$NEW" /tmp/newest.ips
          fi
          echo "--- UIKitCore bundle / bounding path assets ---"
          UIK=/mnt/post/System/Library/PrivateFrameworks/UIKitCore.framework
          sudo ls -la "$UIK" 2>/dev/null | head -40 || true
          sudo find "$UIK" -maxdepth 4 \( -iname '*Bounding*' -o -iname '*.car' \) -printf '%s %p\n' 2>/dev/null | head -60 || true
          echo "-- every bounding path file on the image --"
          sudo find /mnt/post/System /mnt/post/Applications -iname '*BoundingPath*' -printf '%s %p\n' 2>/dev/null | head -60 || true
          echo "-- files containing the 1125x2436 asset name --"
          sudo grep -arl 'BoundingPathBitmap-1125x2436' "$UIK" /mnt/post/System/Library/CoreServices/SpringBoard.app 2>/dev/null | head -20 || true
          echo "-- UIKitCore Info.plist strings --"
          sudo strings -a "$UIK/Info.plist" 2>/dev/null | head -30 || true
          BP="$UIK/BoundingPathData.bundle"
          echo "-- BoundingPathData.bundle modes --"
          sudo ls -la "$BP" 2>/dev/null || true
          for f in "$BP/Assets.car" "$BP/BoundingPathData" "$BP/Info.plist" "$BP/_CodeSignature/CodeResources"; do
            sudo test -f "$f" || continue
            echo "--- $f.gzip.b64 ---"
            sudo gzip -9 -c "$f" | base64 -w0
            echo
          done
          sudo umount /mnt/post || true

      - name: Stage and compress artifacts
        if: always()
        run: |
          mkdir -p stage-logs
          cp qemu-out/fb.png qemu-out/fb.txt qemu-out/regs.txt \
            qemu-out/result.json qemu-out/serial.txt \
            qemu-out/sweet_log_ring.bin qemu-out/sweet_log_total.bin stage-logs/ 2>/dev/null || true
          # The raw console log is >2 GB; gzip it so the artifact stays small.
          gzip -9 -c qemu-out/qemu.log > stage-logs/qemu.log.gz 2>/dev/null || true
          cp qemu-out/fb-[0-9]*s.png stage-logs/ 2>/dev/null || true
          echo "--- snapshot files ---"
          ls -la qemu-out/fb-*s.png 2>/dev/null || true
          for s in qemu-out/fb-*s.png; do
            [ -f "$s" ] || continue
            echo "--- $s.b64 ---"
            base64 -w0 "$s"
            echo
          done
          python3 tools/sweetlog-extract.py qemu-out/sweet_log_ring.bin qemu-out/sweet_log_total.bin \
            stage-logs/sweetlog.txt 2>/dev/null || true
          cp fsck-after.txt stage-logs/ 2>/dev/null || true
          cp /tmp/newest.ips stage-logs/crash-newest.ips 2>/dev/null || true
          cp "$BIG"/payload.bin "$BIG"/sweet-qemu.adt stage-logs/ 2>/dev/null || true
          if [ "${{ inputs.keep_image }}" = "true" ]; then
            # The smoke boot is SIGKILLed, so boot writes are unflushed: repair
            # the volume before it is handed to a local QEMU (no hfsprogs there).
            sudo fsck.hfsplus -f -y "$BIG"/rootfs.img || true
            # ...and drop the state that smoke boot half-wrote. SpringBoard
            # restores its UIKit saved-application state with
            # -[NSURL initFileURLWithPath:] and dies on a nil path, which on
            # this image means a black screen forever. Cheap to recreate.
            sudo mkdir -p /mnt/fixstate
            if sudo mount -t hfsplus -o loop,force "$BIG"/rootfs.img /mnt/fixstate; then
              sudo rm -rf "/mnt/fixstate/private/var/mobile/Library/Saved Application State/com.apple.springboard.savedState" \
                          "/mnt/fixstate/private/var/mobile/Library/Saved Application State/com.apple.springboard.csstore" || true
              sudo ls -la "/mnt/fixstate/private/var/mobile/Library/Saved Application State" 2>&1 | head -10 || true
              sudo umount /mnt/fixstate || true
              sudo fsck.hfsplus -f -y "$BIG"/rootfs.img || true
            else
              echo "could not mount rootfs to clear SpringBoard saved state"
            fi
            gzip -1 "$BIG"/rootfs.img 2>/dev/null || true
          fi
          ls -la "$BIG"/rootfs.img.gz stage-logs 2>/dev/null || ls -la stage-logs

      - uses: actions/upload-artifact@v4
        if: always() && inputs.keep_image
        with:
          name: ios-rootfs
          path: /mnt/heavy/rootfs.img.gz
          retention-days: 3
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: rootfs-logs
          path: stage-logs/
          retention-days: 7
          if-no-files-found: warn
