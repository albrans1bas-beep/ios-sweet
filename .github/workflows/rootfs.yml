name: rootfs

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rootfs

# /home is a small volume on the hosted runners: the IPSW, the OS dmgs and
# the finished image all live on /mnt (the attached ephemeral data disk).
env:
  BIG: /mnt/heavy
  # iPhone X (iPhone10,3) iOS 16.7.2 (20H392), the bring-up userland of the
  # upstream notes; downloaded fresh from Apple, never committed.
  IPSW_DEVICE: iPhone10,3
  IPSW_BUILD: 20H392

jobs:
  rootfs:
    # mkiosroot.sh is a Linux flow (apfs-fuse + mkfs.hfsplus + loop mounts)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          mkdir -p "$BIG" && df -h / /mnt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            hfsprogs qemu-system-arm libfuse3-dev bzip2 libbz2-dev zlib1g-dev \
            libattr1-dev cmake ninja-build g++ rsync clang llvm
          # sgan81/apfs-fuse: Alpine pins 66b86bd (2023-03-12); use the same.
          git clone -q https://github.com/sgan81/apfs-fuse
          git -C apfs-fuse checkout -q 66b86bd525e8cb90f9012543be89b1f092b75cf3
          git -C apfs-fuse submodule update --init --recursive
          cmake -S apfs-fuse -B apfs-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build apfs-build -j"$(nproc)" --target apfs-fuse
          sudo cp apfs-build/apfs-fuse /usr/local/bin/
          rm -rf apfs-fuse apfs-build
          apfs-fuse --help 2>&1 | head -2 || true

      - name: Download IPSW
        run: |
          cd "$BIG"
          gh release download -R blacktop/ipsw -p '*linux_x86_64.tar.gz'
          tar xf ipsw_*_linux_x86_64.tar.gz
          BIN=$(find . -type f -name ipsw -perm -u+x | head -1)
          mv "$BIN" ipswbin
          ./ipswbin download ipsw --device "$IPSW_DEVICE" --build "$IPSW_BUILD" \
            --confirm --output ipsw-dl
          mv ipsw-dl/*.ipsw ipsw.ipsw ; rm -rf ipsw-dl ipswbin ipsw_*_linux_x86_64.tar.gz
          ls -la
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract the three OS dmgs
        run: |
          cd "$BIG"
          python3 - <<'EOF'
          import os, plistlib, zipfile
          z = zipfile.ZipFile('ipsw.ipsw')
          bm = plistlib.loads(z.read('BuildManifest.plist'))
          m = bm['BuildIdentities'][0]['Manifest']
          dmg = {k: v['Info']['Path'] for k, v in m.items()
                 if v.get('Info', {}).get('Path', '').endswith('.dmg')}
          print('dmg keys:', {k: os.path.basename(v) for k, v in dmg.items()})
          want = {}
          for k, p in dmg.items():
              lk = k.lower()
              if lk == 'os' or 'operating' in lk:
                  want['OS'] = p
              elif 'system' in lk:
                  want['SystemOS'] = p
              elif 'app' in lk:
                  want['AppOS'] = p
          assert set(want) == {'OS', 'SystemOS', 'AppOS'}, want
          for k, path in want.items():
              z.extract(path, 'dmgs')
              print(k, '->', path)
              os.replace(os.path.join('dmgs', path), f'dmgs/{k}.dmg')
          EOF
          rm -f ipsw.ipsw
          ls -la dmgs

      - name: Build the HFS+ root
        run: |
          sudo ./tools/mkiosroot.sh "$BIG"/dmgs/OS.dmg "$BIG"/dmgs/SystemOS.dmg \
            "$BIG"/dmgs/AppOS.dmg "$BIG"/rootfs.img 16G

      - name: Apply SWEET root tweaks
        run: |
          sudo fsck.hfsplus -fy "$BIG"/rootfs.img || true
          sudo mkdir -p /mnt/iosroot
          sudo mount -t hfsplus -o loop,force "$BIG"/rootfs.img /mnt/iosroot
          sudo python3 tools/sweet-root-tweaks.py /mnt/iosroot
          sudo umount /mnt/iosroot
          rm -rf "$BIG"/dmgs
          df -h "$BIG"

      - name: Fetch the latest kernel artifact
        run: |
          RUN_ID=$(gh run list -w xnu.yml -b main --limit 30 --json conclusion,databaseId \
            --jq '[.[] | select(.conclusion == "success")][0].databaseId')
          echo "using xnu run $RUN_ID"
          gh run download "$RUN_ID" -n xnu-kernel -D kernel
          ls kernel
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build the boot payload
        run: python3 tools/mkadt.py "$BIG"/sweet-qemu.adt --qemu

      - name: QEMU smoke test
        run: |
          python3 tools/mkpayload.py kernel/kernel.development.sweet "$BIG"/sweet-qemu.adt \
            "$BIG"/payload.bin --cmdline "rd=vroot0 debug=0xc serial=3 cpus=1 keepsyms=1 -enable_kprintf_spam -noprogress wdt=-1"
          sudo env PATH="$PATH" python3 tools/qemu-sweet.py "$BIG"/payload.bin qemu-out \
            --secs 300 --kernel kernel/kernel.development.sweet --disk "$BIG"/rootfs.img \
            --fail-on-panic
          grep -E 'hfs: mounted|init running|panic' qemu-out/fb.txt || true
          grep -q 'hfs: mounted' qemu-out/fb.txt

      - name: Compress and upload
        if: always()
        run: |
          gzip -1 "$BIG"/rootfs.img 2>/dev/null || true
          ls -la "$BIG"/rootfs.img.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ios-rootfs
          path: /mnt/heavy/rootfs.img.gz
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfs-logs
          path: |
            qemu-out/
            /mnt/heavy/payload.bin
            /mnt/heavy/sweet-qemu.adt
          retention-days: 7
          if-no-files-found: warn
